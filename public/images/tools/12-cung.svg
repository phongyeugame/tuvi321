<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <radialGradient id="spaceBg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#1c1608"/>
      <stop offset="50%" stop-color="#0d0d0c"/>
      <stop offset="100%" stop-color="#050505"/>
    </radialGradient>
    <radialGradient id="goldGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F4E4A6" stop-opacity="0.8"/>
      <stop offset="40%" stop-color="#D4AF37" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#D4AF37" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="goldLinear" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F4E4A6"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#997A15"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#spaceBg)"/>

  <!-- Starry dust particles -->
  <g fill="#F4E4A6" opacity="0.6">
    <circle cx="120" cy="80" r="1.5" />
    <circle cx="250" cy="60" r="1.2" />
    <circle cx="680" cy="110" r="1.8" />
    <circle cx="730" cy="320" r="1.5" />
    <circle cx="140" cy="360" r="2" />
    <circle cx="310" cy="390" r="1" />
    <circle cx="600" cy="370" r="1.4" />
    <circle cx="60" cy="220" r="1.6" />
    <circle cx="720" cy="70" r="2.2" filter="url(#glow)"/>
    <circle cx="80" cy="120" r="2" filter="url(#glow)"/>
    <circle cx="710" cy="220" r="1.2" />
    <circle cx="210" cy="190" r="1" />
  </g>

  <!-- Central Astrological Wheel -->
  <g transform="translate(400, 225)">
    <!-- Ambient aura -->
    <circle cx="0" cy="0" r="190" fill="url(#goldGlow)"/>

    <!-- Outer Decorative Ring -->
    <circle cx="0" cy="0" r="180" stroke="url(#goldLinear)" stroke-width="1.5" fill="none" opacity="0.4" stroke-dasharray="4 6"/>
    <circle cx="0" cy="0" r="168" stroke="url(#goldLinear)" stroke-width="2" fill="none" opacity="0.8" filter="url(#glow)"/>
    <circle cx="0" cy="0" r="148" stroke="url(#goldLinear)" stroke-width="1" fill="none" opacity="0.5"/>

    <!-- 12 Radiating Palace Lines -->
    <g stroke="url(#goldLinear)" stroke-width="1.5" opacity="0.75">
      <line x1="0" y1="-168" x2="0" y2="-75"/>
      <line x1="0" y1="168" x2="0" y2="75"/>
      <line x1="-168" y1="0" x2="-75" y2="0"/>
      <line x1="168" y1="0" x2="75" y2="0"/>
      <line x1="-145.5" y1="-84" x2="-65" y2="-37.5"/>
      <line x1="145.5" y1="84" x2="65" y2="37.5"/>
      <line x1="-84" y1="-145.5" x2="-37.5" y2="-65"/>
      <line x1="84" y1="145.5" x2="37.5" y2="65"/>
      <line x1="145.5" y1="-84" x2="65" y2="-37.5"/>
      <line x1="-145.5" y1="84" x2="-65" y2="37.5"/>
      <line x1="84" y1="-145.5" x2="37.5" y2="-65"/>
      <line x1="-84" y1="145.5" x2="-37.5" y2="65"/>
    </g>

    <!-- Palace Marks / Dots -->
    <g fill="#F4E4A6" filter="url(#glow)">
      <circle cx="0" cy="-158" r="3"/>
      <circle cx="79" cy="-136.8" r="3"/>
      <circle cx="136.8" cy="-79" r="3"/>
      <circle cx="158" cy="0" r="3"/>
      <circle cx="136.8" cy="79" r="3"/>
      <circle cx="79" cy="136.8" r="3"/>
      <circle cx="0" cy="158" r="3"/>
      <circle cx="-79" cy="136.8" r="3"/>
      <circle cx="-136.8" cy="79" r="3"/>
      <circle cx="-158" cy="0" r="3"/>
      <circle cx="-136.8" cy="-79" r="3"/>
      <circle cx="-79" cy="-136.8" r="3"/>
    </g>

    <!-- Palace Names Symbols (Subtle golden typography) -->
    <g font-family="serif" font-size="12" fill="#F4E4A6" font-weight="bold" text-anchor="middle" dominant-baseline="middle" opacity="0.9">
      <text x="0" y="-115">MỆNH</text>
      <text x="57.5" y="-99.5">PHỤ MẪU</text>
      <text x="99.5" y="-57.5">PHÚC ĐỨC</text>
      <text x="115" y="0">ĐIỀN TRẠCH</text>
      <text x="99.5" y="57.5">QUAN LỘC</text>
      <text x="57.5" y="99.5">NÔ BỘC</text>
      <text x="0" y="115">THIÊN DI</text>
      <text x="-57.5" y="99.5">TẬT ÁCH</text>
      <text x="-99.5" y="57.5">TÀI BẠCH</text>
      <text x="-115" y="0">TỬ TỨC</text>
      <text x="-99.5" y="-57.5">PHU THÊ</text>
      <text x="-57.5" y="-99.5">HUYNH ĐỆ</text>
    </g>

    <!-- Inner Core & Yin Yang Motif -->
    <circle cx="0" cy="0" r="55" stroke="url(#goldLinear)" stroke-width="2" fill="#0A0A0A" filter="url(#glow)"/>
    <circle cx="0" cy="0" r="48" stroke="url(#goldLinear)" stroke-width="1" fill="none" opacity="0.6" stroke-dasharray="2 3"/>
    
    <!-- Yin Yang -->
    <path d="M 0 -35 A 35 35 0 0 1 0 35 A 17.5 17.5 0 0 1 0 0 A 17.5 17.5 0 0 0 0 -35 Z" fill="url(#goldLinear)" opacity="0.85"/>
    <path d="M 0 -35 A 35 35 0 0 0 0 35 A 17.5 17.5 0 0 0 0 0 A 17.5 17.5 0 0 1 0 -35 Z" fill="#0A0A0A"/>
    <circle cx="0" cy="-17.5" r="5" fill="#0A0A0A"/>
    <circle cx="0" cy="17.5" r="5" fill="#F4E4A6"/>
  </g>
</svg>
