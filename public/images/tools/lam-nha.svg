<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad2" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#14130e"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </radialGradient>
    <linearGradient id="goldStroke2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F4E4A6"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#997711"/>
    </linearGradient>
    <radialGradient id="compassGlow" cx="50%" cy="50%" r="40%">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#D4AF37" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bgGrad2)"/>
  <circle cx="400" cy="225" r="170" fill="url(#compassGlow)"/>

  <!-- Compass Outer Rings -->
  <g stroke="url(#goldStroke2)" fill="none">
    <circle cx="400" cy="225" r="140" stroke-width="1.5" opacity="0.75"/>
    <circle cx="400" cy="225" r="120" stroke-width="1" stroke-dasharray="4 6" opacity="0.4"/>
    <circle cx="400" cy="225" r="95" stroke-width="1" opacity="0.5"/>
    
    <!-- Cardinal Directions Cross -->
    <line x1="400" y1="70" x2="400" y2="380" stroke-width="1" opacity="0.3"/>
    <line x1="245" y1="225" x2="555" y2="225" stroke-width="1" opacity="0.3"/>
    <line x1="290" y1="115" x2="510" y2="335" stroke-width="0.8" stroke-dasharray="2 4" opacity="0.25"/>
    <line x1="290" y1="335" x2="510" y2="115" stroke-width="0.8" stroke-dasharray="2 4" opacity="0.25"/>
  </g>

  <!-- Clean Pagoda Eaves Silhouette (Mái Đình Phong Thủy) -->
  <g stroke="url(#goldStroke2)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Top Pinnacle -->
    <line x1="400" y1="150" x2="400" y2="170" stroke-width="2"/>
    <circle cx="400" cy="148" r="3" fill="#F4E4A6" stroke="none"/>

    <!-- Upper Roof Curve -->
    <path d="M 330 195 Q 400 170 470 195" stroke-width="2"/>
    <path d="M 320 198 Q 328 190 338 193" stroke-width="1.5"/>
    <path d="M 480 198 Q 472 190 462 193" stroke-width="1.5"/>

    <!-- Upper Body Pillar -->
    <line x1="365" y1="192" x2="365" y2="215" stroke-width="1.5"/>
    <line x1="435" y1="192" x2="435" y2="215" stroke-width="1.5"/>

    <!-- Main Lower Roof Curve -->
    <path d="M 285 245 Q 400 215 515 245" stroke-width="2.5"/>
    <!-- Curled Eaves -->
    <path d="M 270 248 Q 282 236 295 242" stroke-width="2"/>
    <path d="M 530 248 Q 518 236 505 242" stroke-width="2"/>

    <!-- Pillars and Base -->
    <line x1="340" y1="240" x2="340" y2="285" stroke-width="2"/>
    <line x1="460" y1="240" x2="460" y2="285" stroke-width="2"/>
    <line x1="380" y1="240" x2="380" y2="285" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.6"/>
    <line x1="420" y1="240" x2="420" y2="285" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.6"/>
    <line x1="315" y1="285" x2="485" y2="285" stroke-width="2.5"/>
  </g>

  <!-- Direction Labels -->
  <g font-family="serif" font-size="11" fill="#D4AF37" text-anchor="middle" font-weight="600" opacity="0.8">
    <text x="400" y="102">KHỞI</text>
    <text x="525" y="229">ĐỊA</text>
    <text x="400" y="355">AN</text>
    <text x="275" y="229">TRẠCH</text>
  </g>
</svg>
