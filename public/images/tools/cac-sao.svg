<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <radialGradient id="spaceBgStars" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#181308"/>
      <stop offset="50%" stop-color="#0e0c08"/>
      <stop offset="100%" stop-color="#050505"/>
    </radialGradient>
    <radialGradient id="tuviGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="1"/>
      <stop offset="25%" stop-color="#F4E4A6" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#D4AF37" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#D4AF37" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="goldBeam" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F4E4A6"/>
      <stop offset="100%" stop-color="#D4AF37"/>
    </linearGradient>
    <filter id="starGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#spaceBgStars)"/>

  <!-- Subtle nebula clouds -->
  <circle cx="420" cy="210" r="220" fill="#D4AF37" opacity="0.08" filter="url(#starGlow)"/>
  <circle cx="200" cy="150" r="160" fill="#F4E4A6" opacity="0.05" filter="url(#starGlow)"/>
  <circle cx="620" cy="280" r="180" fill="#997A15" opacity="0.06" filter="url(#starGlow)"/>

  <!-- Background Tiny Stars -->
  <g fill="#FFF" opacity="0.5">
    <circle cx="80" cy="90" r="1"/>
    <circle cx="150" cy="40" r="1.5"/>
    <circle cx="280" cy="110" r="1.2"/>
    <circle cx="700" cy="80" r="1.5"/>
    <circle cx="750" cy="350" r="1.2"/>
    <circle cx="120" cy="380" r="1.5"/>
    <circle cx="670" cy="380" r="1.3"/>
    <circle cx="340" cy="400" r="1"/>
    <circle cx="50" cy="280" r="1.4"/>
    <circle cx="490" cy="70" r="1.5"/>
  </g>

  <!-- Constellation Geometric Lines -->
  <g stroke="url(#goldBeam)" stroke-width="1.2" opacity="0.6" stroke-dasharray="none">
    <!-- Bac Dau / Big Dipper Shape -->
    <polyline points="140,240 220,200 290,215 360,180 430,225 400,310 330,300 360,180" fill="none"/>
    <!-- Connection to Emperor Star (Tu Vi) -->
    <line x1="430" y1="225" x2="520" y2="150" stroke-dasharray="3 4"/>
    <!-- Nam Dau / Southern Dipper Lines -->
    <polyline points="520,150 600,120 680,160 650,250 580,270 520,150" fill="none" opacity="0.5"/>
    <line x1="680" y1="160" x2="730" y2="220"/>
  </g>

  <!-- Constellation Star Nodes -->
  <g fill="#F4E4A6" filter="url(#starGlow)">
    <circle cx="140" cy="240" r="4"/>
    <circle cx="220" cy="200" r="4"/>
    <circle cx="290" cy="215" r="4.5"/>
    <circle cx="330" cy="300" r="5"/>
    <circle cx="400" cy="310" r="5"/>
    <circle cx="430" cy="225" r="5.5"/>
    <circle cx="600" cy="120" r="4.5"/>
    <circle cx="680" cy="160" r="5"/>
    <circle cx="650" cy="250" r="4"/>
    <circle cx="580" cy="270" r="4.5"/>
    <circle cx="730" cy="220" r="3.5"/>
  </g>

  <!-- Emperor Star (Tử Vi) - Radiant Golden Pulsar -->
  <g transform="translate(520, 150)">
    <circle cx="0" cy="0" r="70" fill="url(#tuviGlow)"/>
    <!-- Star Rays -->
    <line x1="0" y1="-35" x2="0" y2="35" stroke="#FFF" stroke-width="2" filter="url(#starGlow)"/>
    <line x1="-35" y1="0" x2="35" y2="0" stroke="#FFF" stroke-width="2" filter="url(#starGlow)"/>
    <line x1="-20" y1="-20" x2="20" y2="20" stroke="#F4E4A6" stroke-width="1.2" opacity="0.7"/>
    <line x1="20" y1="-20" x2="-20" y2="20" stroke="#F4E4A6" stroke-width="1.2" opacity="0.7"/>
    <circle cx="0" cy="0" r="8" fill="#FFF" filter="url(#starGlow)"/>
    <!-- Label -->
    <text x="0" y="52" font-family="serif" font-size="14" font-weight="bold" fill="#F4E4A6" text-anchor="middle" filter="url(#starGlow)">SAO TỬ VI</text>
    <text x="0" y="68" font-family="sans-serif" font-size="10" fill="#A8A8A0" text-anchor="middle">Đế Tinh - Chí Tôn</text>
  </g>

  <!-- Other Named Stars -->
  <g font-family="serif" font-size="11" fill="#F4E4A6" opacity="0.85">
    <text x="360" y="165" text-anchor="middle">Thiên Cơ</text>
    <text x="290" y="235" text-anchor="middle">Thái Dương</text>
    <text x="435" y="335" text-anchor="middle">Vũ Khúc</text>
    <text x="680" y="145" text-anchor="middle">Thiên Phủ</text>
  </g>
</svg>
