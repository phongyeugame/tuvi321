<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad1" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#15130f"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </radialGradient>
    <linearGradient id="goldStroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F4E4A6"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#AA8822"/>
    </linearGradient>
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="40%">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#D4AF37" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bgGrad1)"/>

  <!-- Center subtle ambient glow -->
  <circle cx="400" cy="225" r="180" fill="url(#centerGlow)"/>

  <!-- Minimalist Grid / Celestial Lines -->
  <g stroke="#D4AF37" stroke-width="1" opacity="0.15">
    <line x1="100" y1="225" x2="700" y2="225"/>
    <line x1="400" y1="50" x2="400" y2="400"/>
    <circle cx="400" cy="225" r="160" fill="none" stroke-dasharray="4 6"/>
  </g>

  <!-- Two Intersecting Harmony Rings (Biểu tượng Vợ Chồng Hòa Hợp) -->
  <g stroke="url(#goldStroke)" fill="none">
    <!-- Left Ring (Âm / Thê) -->
    <circle cx="340" cy="225" r="95" stroke-width="2" opacity="0.85"/>
    <circle cx="340" cy="225" r="85" stroke-width="1" opacity="0.4" stroke-dasharray="3 4"/>
    
    <!-- Right Ring (Dương / Phu) -->
    <circle cx="460" cy="225" r="95" stroke-width="2" opacity="0.85"/>
    <circle cx="460" cy="225" r="85" stroke-width="1" opacity="0.4" stroke-dasharray="3 4"/>

    <!-- Intersection Center Balance -->
    <circle cx="400" cy="225" r="45" stroke-width="1.5" stroke-dasharray="2 3" opacity="0.7"/>
    <circle cx="400" cy="225" r="8" fill="#F4E4A6" stroke="none" opacity="0.9"/>
  </g>

  <!-- Minimalist Celestial Nodes & Accents -->
  <g fill="#F4E4A6">
    <circle cx="340" cy="130" r="3" opacity="0.7"/>
    <circle cx="340" cy="320" r="3" opacity="0.7"/>
    <circle cx="460" cy="130" r="3" opacity="0.7"/>
    <circle cx="460" cy="320" r="3" opacity="0.7"/>

    <circle cx="245" cy="225" r="2.5" opacity="0.6"/>
    <circle cx="555" cy="225" r="2.5" opacity="0.6"/>
  </g>

  <!-- Subtle Typography Label -->
  <text x="400" y="360" font-family="serif" font-size="13" font-weight="600" fill="#D4AF37" text-anchor="middle" letter-spacing="4" opacity="0.75">
    HÒA HỢP ÂM DƯƠNG
  </text>
</svg>
