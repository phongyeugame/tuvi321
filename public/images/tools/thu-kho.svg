<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <radialGradient id="libraryBg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#191408"/>
      <stop offset="60%" stop-color="#0c0a07"/>
      <stop offset="100%" stop-color="#050505"/>
    </radialGradient>
    <radialGradient id="tomeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F4E4A6" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#D4AF37" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#D4AF37" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="goldGradientBook" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F4E4A6"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#8c6c10"/>
    </linearGradient>
    <filter id="glowLib">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#libraryBg)"/>

  <!-- Golden Light Aura -->
  <circle cx="400" cy="225" r="200" fill="url(#tomeGlow)"/>

  <!-- Background Floating Runes & Glyphs -->
  <g font-family="serif" font-size="18" fill="#D4AF37" opacity="0.3" filter="url(#glowLib)">
    <text x="120" y="100">乾</text>
    <text x="180" y="340">坤</text>
    <text x="650" y="120">震</text>
    <text x="680" y="360">巽</text>
    <text x="260" y="80">坎</text>
    <text x="540" y="390">離</text>
    <text x="100" y="240">艮</text>
    <text x="700" y="230">兌</text>
  </g>

  <!-- Star dust around the scroll -->
  <g fill="#F4E4A6" opacity="0.6">
    <circle cx="280" cy="140" r="1.5"/>
    <circle cx="330" cy="110" r="2" filter="url(#glowLib)"/>
    <circle cx="480" cy="120" r="1.8" filter="url(#glowLib)"/>
    <circle cx="530" cy="150" r="1.5"/>
    <circle cx="240" cy="300" r="1.2"/>
    <circle cx="560" cy="290" r="1.6"/>
  </g>

  <!-- Open Mystical Ancient Book / Scroll -->
  <g transform="translate(400, 230)">
    <!-- Book Base / Cover Shadow -->
    <path d="M -160 50 Q 0 80 160 50 L 170 -60 Q 0 -30 -170 -60 Z" fill="#141005" stroke="url(#goldGradientBook)" stroke-width="2" opacity="0.9"/>

    <!-- Left Page -->
    <path d="M -160 40 Q -80 60 0 50 L 0 -70 Q -80 -60 -160 -80 Z" fill="#1f1a0d" stroke="url(#goldGradientBook)" stroke-width="1.5"/>
    <!-- Right Page -->
    <path d="M 0 50 Q 80 60 160 40 L 160 -80 Q 80 -60 0 -70 Z" fill="#241e10" stroke="url(#goldGradientBook)" stroke-width="1.5"/>

    <!-- Spine -->
    <line x1="0" y1="-70" x2="0" y2="50" stroke="url(#goldGradientBook)" stroke-width="3"/>

    <!-- Page Text Lines (Golden Glyphs) -->
    <g stroke="url(#goldGradientBook)" stroke-width="1" opacity="0.6" stroke-dasharray="8 4 16 4">
      <!-- Left Page lines -->
      <line x1="-135" y1="-50" x2="-25" y2="-45"/>
      <line x1="-135" y1="-30" x2="-25" y2="-25"/>
      <line x1="-135" y1="-10" x2="-25" y2="-5"/>
      <line x1="-135" y1="10" x2="-25" y2="15"/>
      <line x1="-135" y1="30" x2="-25" y2="35"/>

      <!-- Right Page lines -->
      <line x1="25" y1="-45" x2="135" y2="-50"/>
      <line x1="25" y1="-25" x2="135" y2="-30"/>
      <line x1="25" y1="-5" x2="135" y2="-10"/>
      <line x1="25" y1="15" x2="135" y2="10"/>
      <line x1="25" y1="35" x2="135" y2="30"/>
    </g>

    <!-- Center Radiant Seal / Octagram rising from pages -->
    <g transform="translate(0, -90)">
      <circle cx="0" cy="0" r="32" stroke="url(#goldGradientBook)" stroke-width="1.5" fill="#0A0A0A" opacity="0.9" filter="url(#glowLib)"/>
      <circle cx="0" cy="0" r="26" stroke="url(#goldGradientBook)" stroke-width="1" fill="none" opacity="0.6" stroke-dasharray="3 3"/>
      <!-- Eight Trigrams / Bagua Center -->
      <polygon points="0,-18 13,-13 18,0 13,13 0,18 -13,13 -18,0 -13,-13" fill="none" stroke="url(#goldGradientBook)" stroke-width="1.2"/>
      <circle cx="0" cy="0" r="5" fill="#F4E4A6" filter="url(#glowLib)"/>
    </g>
  </g>
</svg>
